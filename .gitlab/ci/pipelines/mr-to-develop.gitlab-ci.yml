image: node:20-alpine

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/
    - .npm
  policy: pull-push

install:
  stage: setup
  tags:
    - docker-linux
  interruptible: true
  script:
    - npm ci --prefer-offline
  artifacts:
    paths:
      - package-lock.json
    expire_in: 1 day

lint:
  stage: lint
  tags:
    - docker-linux
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm
    policy: pull
  script:
    - npm ci --prefer-offline
    - npm run lint

test:
  stage: test
  tags:
    - docker-linux
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm
    policy: pull
  script:
    - npm ci --prefer-offline
    - npm run test

build:
  stage: build
  tags:
    - docker-linux
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm
    policy: pull
  script:
    - npm ci --prefer-offline
    - npm run build
